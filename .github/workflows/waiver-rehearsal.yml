name: Waiver browser rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waiver-rehearsal:
    name: Local waiver browser rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Rehearse against isolated providers
        run: |
          pnpm dev:waivers > /tmp/waiver-sandbox.log 2>&1 &
          sandbox_pid=$!
          trap 'kill -INT "$sandbox_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:3000/api/waivers/required > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/waiver-sandbox.log
            exit 1
          fi
          pnpm test:waivers:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: waiver-rehearsal-failure
          path: |
            playwright-report/
            test-results/
            .local/waiver-tests/run-*/*.log
            /tmp/waiver-sandbox.log
